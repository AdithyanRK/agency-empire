<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Agency Empire" />
  <meta name="theme-color" content="#241F17" />
<title>Agency Empire</title>
<script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink:#3A2358; --ink2:#7A5E9B; --paper:#FFF6FB; --card:#FFFFFF;
    --line:#EBD9F2; --gold:#FFD23F; --gold-d:#E0961A; --gold-ink:#7A4A05;
    --buy:#3FBF4F; --buy-d:#2A8C39; --danger:#F0483E; --shade:rgba(58,35,88,0.62);
    --grape:#5B2A86; --grape-d:#3A1A5C;
  }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; overflow:hidden; background:#2B1440; font-family:'Fredoka',system-ui,sans-serif; }
  body { display:flex; align-items:center; justify-content:center; }
  #wrap { position:relative; }
  canvas { display:block; touch-action:none; }
  #gl { position:absolute; left:0; top:0; width:100%; height:100%; z-index:0; display:none; }
  #gl.on { display:block; }
  #game { position:absolute; left:0; top:0; width:100%; height:100%; z-index:1; }
  .hud { position:absolute; top:0; left:0; right:0; padding:calc(10px + env(safe-area-inset-top, 0px)) calc(12px + env(safe-area-inset-right, 0px)) 10px calc(12px + env(safe-area-inset-left, 0px)); display:flex; align-items:flex-start; justify-content:space-between; pointer-events:none; z-index:5; }
  .chip { background:linear-gradient(#7B45A8,var(--grape)); color:#FFF3FF; border:2px solid rgba(255,255,255,0.35); border-radius:18px; padding:8px 14px; font-size:14px; font-weight:700; line-height:1.2; box-shadow:0 4px 0 var(--grape-d), 0 6px 14px rgba(0,0,0,0.28); }
  .chip small { display:block; font-size:11px; opacity:0.8; font-weight:500; }
  #cash { pointer-events:auto; cursor:pointer; font-family:inherit; display:flex; align-items:center; gap:11px;
    font-weight:700; font-size:29px; line-height:1; letter-spacing:0.4px; color:var(--gold-ink);
    background:linear-gradient(#FFF3C4,#FFC93C); padding:9px 24px 9px 14px; border-radius:28px;
    border:3px solid #FFFDF0; box-shadow:0 5px 0 var(--gold-d), 0 8px 18px rgba(0,0,0,0.3); transition:transform 0.12s; }
  #cash .cashcol { display:flex; flex-direction:column; align-items:flex-start; }
  #cash .coin { flex:none; width:34px; height:34px; margin:-2px 0; filter:drop-shadow(0 2px 1px rgba(120,80,0,0.35)); }
  #cash.pop .coin { animation:coinspin 0.4s ease-out; }
  @keyframes coinspin { 0% { transform:rotateY(0deg) scale(1);} 50% { transform:rotateY(180deg) scale(1.12);} 100% { transform:rotateY(360deg) scale(1);} }
  #cash.pop { transform:scale(1.08); }

  .hbtns { display:flex; gap:8px; }
  .hbtn { pointer-events:auto; width:42px; height:42px; border-radius:50%; border:none; background:var(--shade); backdrop-filter:blur(3px); color:#FFF6E4; font-size:17px; font-weight:600; cursor:pointer; font-family:inherit; box-shadow:0 3px 0 rgba(0,0,0,0.22); }
  .hbtn:active { transform:translateY(2px); box-shadow:0 1px 0 rgba(0,0,0,0.22); }
  #payChip { display:block; font-size:11.5px; font-weight:600; line-height:1.1; margin-top:1px;
    color:#8A5A06; opacity:0.92; white-space:nowrap; }
  #lvlBar { position:absolute; left:12px; top:76px; z-index:5; display:flex; align-items:center; gap:6px;
    background:var(--shade); border-radius:15px; padding:4px 9px 4px 4px; color:#FFF3FF; font-size:11px; font-weight:700; }
  #lvlStar { position:relative; font-size:19px; line-height:1; }
  #lvlStar b { position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-size:10px; color:#7A4A05; padding-top:2px; }
  .lvlTrack { width:54px; height:7px; border-radius:4px; background:rgba(255,255,255,0.25); overflow:hidden; }
  .lvlTrack i { display:block; height:100%; width:0; background:linear-gradient(90deg,#8FE06B,#3FBF4F); border-radius:4px; transition:width 0.3s; }
  #objective { letter-spacing:0.2px; font-size:13px; width:max-content; max-width:calc(100% - 24px); white-space:normal; line-height:1.15; position:absolute; top:118px; left:50%; transform:translateX(-50%); background:var(--paper); color:var(--ink); padding:7px 14px 7px 7px; border-radius:20px; font-weight:600;
    z-index:5; text-align:left; pointer-events:none; display:flex; align-items:center; gap:9px;
    box-shadow:0 4px 0 rgba(59,50,39,0.18), 0 6px 14px rgba(0,0,0,0.2); }
  #objIcon { flex:none; width:34px; height:34px; border-radius:50%; background:#EDE2F7; display:flex;
    align-items:center; justify-content:center; font-size:18px; }
  .objtxt { display:flex; flex-direction:column; gap:4px; min-width:96px; }
  .objTrack { height:8px; border-radius:4px; background:#E6DAF0; overflow:hidden; }
  .objTrack i { display:block; height:100%; width:0; background:linear-gradient(90deg,#7AC8F5,#3F8FD0); border-radius:4px; transition:width 0.3s; }
  #toast { position:absolute; bottom:calc(26px + env(safe-area-inset-bottom, 0px)); left:50%; transform:translateX(-50%); background:var(--shade); backdrop-filter:blur(3px); color:#FFF6E4; padding:11px 20px; border-radius:16px; font-size:14px; font-weight:500; z-index:8; pointer-events:none; opacity:0; transition:opacity 0.3s, transform 0.3s; box-shadow:0 4px 0 rgba(0,0,0,0.2); }
  .ov { position:absolute; inset:0; background:rgba(20,16,10,0.5); z-index:10; display:none; align-items:flex-end; justify-content:center; }
  .ov.show { display:flex; }
  .grabzone { position:sticky; top:0; z-index:2; background:var(--paper); padding:9px 0 7px; margin:0 -14px 2px;
    touch-action:none; cursor:grab; }
  .grab { width:46px; height:5px; border-radius:3px; background:#D8C6E8; margin:0 auto; }
  .card { background:var(--paper); touch-action:pan-y; -webkit-overflow-scrolling:touch; width:100%; max-height:82%;
    border-radius:26px 26px 0 0; padding:0 14px calc(28px + env(safe-area-inset-bottom, 0px)); overflow-y:auto;
    overscroll-behavior:contain; box-shadow:0 -8px 30px rgba(0,0,0,0.3); }
  .handle { width:44px; height:5px; border-radius:3px; background:#D8CCB2; margin:2px auto 10px; }
  .phead { display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
  .phead h2 { font-size:19px; color:var(--ink); }
  .pcash { font-size:15px; font-weight:700; color:var(--gold-ink); background:linear-gradient(#FFE9A8,#FFD75E); padding:5px 13px; border-radius:14px; box-shadow:0 2px 0 var(--gold-d); }
  .tabs { display:flex; gap:6px; background:#EFE6D2; padding:5px; border-radius:16px; margin-bottom:12px; }
  .tab { flex:1; border:none; font-family:inherit; font-size:14px; font-weight:600; color:var(--ink2); background:transparent; padding:9px 4px; border-radius:12px; cursor:pointer; }
  .tab.on { background:var(--card); color:var(--ink); box-shadow:0 2px 0 rgba(59,50,39,0.12); }
  .row { display:none; align-items:center; gap:11px; background:var(--card); border:1px solid var(--line); border-radius:16px; padding:10px 11px; margin-bottom:8px; box-shadow:0 2px 0 rgba(59,50,39,0.06); }
  .card.t-team .row.tb-team, .card.t-ups .row.tb-ups, .card.t-verts .row.tb-verts { display:flex; }
  .cat { display:none; font-size:11px; font-weight:700; letter-spacing:0.1em; text-transform:uppercase; color:#A8987A; margin:10px 4px 6px; }
  .card.t-ups .cat.tb-ups { display:block; }
  .tile { flex:none; width:42px; height:42px; border-radius:13px; display:flex; align-items:center; justify-content:center; font-size:17px; font-weight:700; color:#fff; box-shadow:inset 0 -3px 0 rgba(0,0,0,0.18); }
  .row .info { flex:1; min-width:0; }
  .row .nm { font-size:14.5px; font-weight:600; color:var(--ink); }
  .row .ds { font-size:12px; color:var(--ink2); }
  .pips { display:flex; gap:3px; margin-top:4px; }
  .pip { width:15px; height:5px; border-radius:3px; background:#E9DEC4; }
  .pip.on { background:var(--gold-d); }
  .buy { border:2px solid rgba(255,255,255,0.4); border-radius:15px; padding:10px 14px; font-family:inherit; font-size:14px; font-weight:700; color:#fff; background:linear-gradient(#6BC47A,var(--buy)); box-shadow:0 3px 0 var(--buy-d); cursor:pointer; white-space:nowrap; min-width:72px; }
  .buy:active { transform:translateY(2px); box-shadow:0 1px 0 var(--buy-d); }
  .buy:disabled { background:#D5CBB4; box-shadow:0 3px 0 #B8AD94; color:#FFFDF6; cursor:default; }
  .buy.max { background:linear-gradient(#C9BFA6,#B4A98E); box-shadow:0 3px 0 #9A8F76; }
  .buy:focus-visible, .tab:focus-visible, .hbtn:focus-visible { outline:3px solid #7AB8FF; outline-offset:2px; }
  .closeb { width:100%; margin-top:10px; border:none; border-radius:16px; padding:14px; font-family:inherit; font-size:15px; font-weight:700; background:var(--ink); color:#FFF6E4; cursor:pointer; box-shadow:0 4px 0 #201A12; }
  .closeb:active { transform:translateY(2px); box-shadow:0 2px 0 #201A12; }
  .mcard { background:var(--paper); border-radius:22px; padding:24px 20px; margin:0 22px; max-width:360px; text-align:center; align-self:center; box-shadow:0 10px 30px rgba(0,0,0,0.35); }
  .ov.center { align-items:center; }
  .mcard h2 { font-size:20px; color:var(--ink); margin-bottom:8px; }
  .mcard p { font-size:14px; color:var(--ink2); line-height:1.5; margin-bottom:18px; }
  .mrow { display:flex; gap:10px; }
  .mbtn { flex:1; border:2px solid rgba(255,255,255,0.4); border-radius:16px; padding:13px; font-family:inherit; font-size:15px; font-weight:700; cursor:pointer; }
  .mbtn.pri { background:linear-gradient(#6BC47A,var(--buy)); color:#fff; box-shadow:0 3px 0 var(--buy-d); }
  .mbtn.sec { background:linear-gradient(#F3E7FA,#E3D0F0); color:var(--ink); box-shadow:0 3px 0 #C9B0DE; }
  .mbtn:active { transform:translateY(2px); box-shadow:none; }
  #splash { position:absolute; inset:0; z-index:20; display:flex; align-items:center; justify-content:center;
    background:radial-gradient(circle at 50% 34%, #7B45A8, #2B1440 74%); padding:24px; text-align:center; }
  #splash.gone { display:none; }
  .spcard { width:100%; max-width:340px; display:flex; flex-direction:column; gap:11px; }
  .sptitle { font-weight:700; font-size:40px; line-height:0.98; color:#FFD23F; letter-spacing:1px;
    text-shadow:0 4px 0 #B4700D, 0 8px 18px rgba(0,0,0,0.45); margin-bottom:2px; }
  .sptitle span { display:block; color:#FFF3FF; text-shadow:0 4px 0 #6A2FA0, 0 8px 18px rgba(0,0,0,0.45); }
  .spsub { color:#E8D6F6; font-size:15px; font-weight:600; margin-bottom:14px; }
  .spbtn { padding:15px; font-size:16px; }
  #spPlay { font-weight:700; font-size:20px; padding:17px; letter-spacing:0.5px; }
  @media (prefers-reduced-motion: reduce) { #cash, #toast, .buy, .mbtn, .closeb, .hbtn { transition:none; } }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="gl"></canvas>
  <canvas id="game"></canvas>
  <div class="hud">
    <button class="hbtn" id="countryChip" title="Your offices">&#127758;</button>
    <button id="cash"><svg class="coin" viewBox="0 0 40 40" aria-hidden="true">
      <circle cx="20" cy="21" r="17" fill="#B8791A"/>
      <circle cx="20" cy="19" r="17" fill="#E8A72B"/>
      <circle cx="20" cy="19" r="13.5" fill="#FFD34D"/>
      <circle cx="20" cy="19" r="13.5" fill="none" stroke="#C98A16" stroke-width="1.6"/>
      <path d="M20 8.5a13 13 0 0 1 11 6.4A15 15 0 0 0 20 11a15 15 0 0 0-11 3.9A13 13 0 0 1 20 8.5z" fill="#FFF3C4" opacity="0.85"/>
      <text x="20" y="25.5" text-anchor="middle" font-family="Fredoka, sans-serif" font-size="17" font-weight="700" fill="#A5700F">$</text>
    </svg><span class="cashcol"><span id="cashNum">$0</span><small id="payChip">&nbsp;</small></span></button>
    <div class="hbtns">
      <button class="hbtn" id="setBtn" title="Settings">&#9881;&#65039;</button>
    </div>
  </div>
  <div id="lvlBar"><span id="lvlStar">&#11088;<b id="lvlNum">1</b></span><span class="lvlTrack"><i id="lvlFill"></i></span><span id="lvlTxt">0/15</span></div>
  <div id="objective"><span id="objIcon">&#128196;</span><span class="objtxt"><b id="objText">…</b><span class="objTrack"><i id="objFill"></i></span></span></div>
  <div id="toast"></div>
  <div id="splash">
    <div class="spcard">
      <div class="sptitle">AGENCY<span>EMPIRE</span></div>
      <div class="spsub">Run the agency. Place the people. Take the fee.</div>
      <button class="mbtn pri spbtn" id="spPlay">Play</button>
      <button class="mbtn sec spbtn" id="spTour">How to play</button>
      <button class="mbtn sec spbtn" id="spNew">New game</button>
      <button class="mbtn sec spbtn" id="spSnd">Sound: on</button>
    </div>
  </div>
  <div class="ov" id="panel">
    <div class="card t-team" id="panelCard">
      <div class="grabzone" id="panelGrab"><div class="grab"></div></div>
      <div class="handle"></div>
      <div class="phead"><h2>Manager desk</h2><div class="pcash" id="panelCash">$0</div></div>
      <div class="tabs">
        <button class="tab on" data-tab="team" id="tabTeam">Team</button>
        <button class="tab" data-tab="ups" id="tabUps">Upgrades</button>
        <button class="tab" data-tab="verts" id="tabVerts">Industries</button>
      </div>
      <div id="panelRows"></div>
      <button class="closeb" id="panelClose">Close</button>
    </div>
  </div>
  <div class="ov center" id="modal">
    <div class="mcard">
      <h2 id="mTitle"></h2>
      <p id="mBody"></p>
      <div class="mrow" id="mBtns"></div>
    </div>
  </div>
</div>
<script>
'use strict';
const VW = 900, VH = 1500;      // the office floor is now bigger than one screen
const VIEW_W = 620;            // how much of it fits across the screen width
const BG_M = 260;              // floor baked past the walls so edges never show blank
const cv = document.getElementById('game');
let ctx = cv.getContext('2d');
const wrap = document.getElementById('wrap');

const VERTS = {
  bc: { name:'Blue collar', color:'#B15B3E', dark:'#6B3120', fee:17 },
  it: { name:'IT staffing', color:'#4A90D9', dark:'#1E4E82', fee:40 },
  hc: { name:'Healthcare', color:'#2FA98C', dark:'#125E4B', fee:82 }
};
const VERTCOST = { it:350, hc:1150 };
const COUNTRIES = [
  { name:'India',  flag:'\u{1F1EE}\u{1F1F3}', mul:1,  floorA:'#FFF1DC', floorB:'#FFE6C2', wall:'#4EC0CE', accent:'#F2762E', sky:'rgba(190,240,255,0.7)', rug:'rgba(255,252,244,0.5)', passive:2,   moveCost:2400  },
  { name:'Dubai',  flag:'\u{1F1E6}\u{1F1EA}', mul:2.4,  floorA:'#FFF6D9', floorB:'#FFEBB4', wall:'#F2A63B', accent:'#E0761B', sky:'rgba(255,225,160,0.7)', rug:'rgba(255,250,232,0.5)', passive:9,   moveCost:25000 },
  { name:'USA',    flag:'\u{1F1FA}\u{1F1F8}', mul:6, floorA:'#EFEAFB', floorB:'#E2D9F6', wall:'#7A6BE0', accent:'#4B3BC4', sky:'rgba(180,200,255,0.7)', rug:'rgba(252,253,255,0.55)', passive:26,  moveCost:Infinity }
];
// req = placements needed before the upgrade appears at all (the genre reveals a few at a time)
// sub = monthly software subscription per level, charged with payroll
const UPS = {
  speed:    { name:'Founder hustle',  base:40,  mult:1.7,  max:6, req:0,  desc:'You move 12% faster' },
  printer:  { name:'Job board plan',  base:60,  mult:1.8,  max:6, req:0,  sub:3, desc:'Resumes print faster' },
  screen:   { name:'AI resume screening', base:80, mult:1.8, max:6, req:3, sub:5, desc:'Screening runs faster' },
  cap:      { name:'Carry capacity',  base:60,  mult:1.8,  max:5, req:5,  desc:'+1 resume carried, +1 follower' },
  booth:    { name:'Interview rooms', base:180, mult:1.85, max:3, req:8,  desc:'+1 interview room' },
  zone:     { name:'Waiting area',    base:90,  mult:1.8,  max:3, req:12, desc:'+2 screened candidate spots' },
  quality:  { name:'Sourcing quality',base:170, mult:1.95, max:5, req:15, desc:'Fewer resumes rejected at screening' },
  staff:    { name:'Staff speed',     base:150, mult:1.95, max:5, req:18, desc:'Staff move 18% faster' },
  ads:      { name:'Ad campaigns',    base:100, mult:1.85, max:6, req:22, desc:'Clients arrive 8% faster' },
  ready:    { name:'Placement bench', base:110, mult:1.85, max:2, req:26, desc:'+2 ready candidate spots' },
  aiint:    { name:'AI phone screener', base:220, mult:1.9, max:5, req:30, sub:8, desc:'Interviews run 18% faster' },
  rep:      { name:'Employer brand',  base:120, mult:2.05, max:4, req:34, desc:'Fees +15% per level' },
  staffcap: { name:'Staff capacity',  base:200, mult:1.95, max:4, req:38, desc:'Staff carry and lead more' },
  patience: { name:'Client lounge',   base:80,  mult:1.9,  max:4, req:42, desc:'Clients wait 20% longer' },
  slots:    { name:'Client desks',    base:400, mult:2.0,  max:1, req:46, desc:'One more client can wait' },
  vipnet:   { name:'Premium network', base:250, mult:2.0,  max:3, req:50, desc:'+3% chance of VIP clients (they pay 5x)' },
};
const UPCATS = [
  ['Founder', ['speed','cap']],
  ['Team', ['staff','staffcap','quality']],
  ['Software', ['printer','screen','aiint']],
  ['Marketing', ['ads','rep','patience','vipnet']],
  ['Office', ['booth','zone','ready','slots']]
];
const PEOPLE_SC = 1.25;  // with the follow camera this reads ~5.5% of screen height, close to the reference
                         // measured Pizza Ready sits at 7.8-10.7%, but it uses a follow camera)
const CAND_SC = 0.62 * PEOPLE_SC;   // candidates read smaller than staff so queues breathe
const STAFF_UNIFORM = '#4A5160';
const ROLE_TAG = { sourcer:'S', rec:'R', am:'A', fin:'F' };
const SALARY = { sourcer:17, rec:23, am:29, fin:20 };
const MONTH = 45;
const HIRES = {
  sourcer: { name:'Sourcer',         cost:180, max:4, desc:'Ferries resumes to screening' },
  rec:     { name:'Recruiter',       cost:120, max:4, desc:'Runs a room and fetches candidates' },
  am:      { name:'Account manager', cost:400, max:4, desc:'Introduces ready candidates to clients' },
  fin:     { name:'Finance exec',    cost:320, max:1, desc:'Collects and banks your fees' }
};
// One grid: a service column on the left, the hiring pipeline flowing down the middle.
// COL_X is the left column, MAIN_X..MAIN_R the pipeline column; every row shares those edges.
const COL_X = 40, COL_W = 190, MAIN_X = 276, MAIN_W = 584, MAIN_R = MAIN_X + MAIN_W;
const ROW_Y = [170, 400, 660, 910, 1230];   // board/desk, waiting, rooms, bench, lobby
const L = {
  printer: { x:MAIN_X,      y:ROW_Y[0], w:270, h:104 },
  desk:    { x:MAIN_R-270,  y:ROW_Y[0], w:270, h:104 },
  zone:    { x:MAIN_X,      y:ROW_Y[1], w:MAIN_W, h:170 },
  booth:   { x:MAIN_X,      y:ROW_Y[2], w:MAIN_W, h:150 },
  lobby:   { x:MAIN_X,      y:ROW_Y[4], w:MAIN_W, h:160 },
  door:    { x:COL_X,       y:ROW_Y[4], w:104, h:160 },
  mgr:     { x:COL_X,       y:ROW_Y[2], w:COL_W, h:116 },
  banner:  { x:COL_X+34,    y:ROW_Y[3], w:108, h:84 },
  pads:    { sourcer:{x:COL_X+90,y:ROW_Y[0]+150}, rec:{x:MAIN_X+60,y:ROW_Y[2]-40},
             am:{x:MAIN_X+70,y:ROW_Y[4]-70}, fin:{x:MAIN_R-60,y:ROW_Y[4]-70} },
  shred:   { x:COL_X+52,    y:ROW_Y[0]+16, w:70, h:62 },
  exit:    { x:MAIN_R-104,  y:34,  w:104, h:58 }
};
const BENCH = { x:MAIN_X, y:ROW_Y[3], w:MAIN_W, h:96 };
const FIN_POST = { x:MAIN_R - 78, y:ROW_Y[4] - 44 };   // open band beside the lobby, clear of the promo stand
const boothSlots = [];
const SLOT_X = i => MAIN_X + 62 + i * ((MAIN_W - 124) / 5);
for (let i=0;i<6;i++) boothSlots.push({ x:SLOT_X(i), y:L.booth.y + 82 });
const readySpots = [];
for (let i=0;i<6;i++) readySpots.push({ x:SLOT_X(i), y:BENCH.y + 52 });
const zoneSlots = [];
for (let r=0;r<2;r++) for (let c=0;c<6;c++) zoneSlots.push({ x:SLOT_X(c), y:L.zone.y + 58 + r * 72 });
const clientSlots = [0,1,2,3].map(i => ({ x: L.lobby.x + 96 + i * ((L.lobby.w - 192) / 3), y: L.lobby.y + 96 }));

function weightedPick(w) {
  let tot = 0; for (const k in w) tot += w[k];
  let r = Math.random()*tot;
  for (const k in w) { r -= w[k]; if (r <= 0) return k; }
  return state.verts[0];
}
function pipelineSupply() {
  const s = {}; state.verts.forEach(v => s[v] = 0);
  candidates.forEach(c => { if (!c.dead && c.st !== 'expire' && s[c.vert] != null) s[c.vert] += 1; });
  deskQueue.forEach(v => { if (s[v] != null) s[v] += 0.8; });
  printerStack.forEach(v => { if (s[v] != null) s[v] += 0.6; });
  return s;
}
function openDemand() {
  const d = {}; state.verts.forEach(v => d[v] = 0);
  clients.forEach(cl => { if (cl.st !== 'leave' && d[cl.vert] != null) d[cl.vert] += cl.need; });
  return d;
}
function bestDemandVert(cur) {
  const readySup = {}; state.verts.forEach(v => readySup[v] = 0);
  candidates.forEach(c => {
    if (c.dead || readySup[c.vert] == null) return;
    if (c.st === 'ready' || c.st === 'fetched' || (c.st === 'follow' && c.done)) readySup[c.vert] += 1;
  });
  let best = null, bestGap = 0;
  state.verts.forEach(v => {
    let dem = 0;
    clients.forEach(cl => { if (cl.vert === v && (cl.st === 'wait' || cl.st === 'in')) dem += cl.need; });
    const gap = dem - readySup[v];
    if (gap > bestGap) { bestGap = gap; best = v; }
  });
  return best || cur;
}
function pickResumeVert() {
  const sup = pipelineSupply(), dem = openDemand(), w = {};
  state.verts.forEach(v => { w[v] = Math.max(0.12, 0.6 + dem[v]*1.8 - sup[v]*1.1); });
  return weightedPick(w);
}
function pickClientVert() {
  const w = {};
  state.verts.forEach(v => w[v] = 0.5);
  candidates.forEach(c => {
    if (c.dead || w[c.vert] == null) return;
    if (c.st === 'ready') w[c.vert] += 4.5;
    else if (c.st === 'booth') w[c.vert] += 2.2;
    else w[c.vert] += 1.0;
  });
  deskQueue.forEach(v => { if (w[v] != null) w[v] += 0.5; });
  clients.forEach(cl => { if (cl.st !== 'leave' && w[cl.vert] != null) w[cl.vert] = Math.max(0.2, w[cl.vert] - cl.need*1.2); });
  return weightedPick(w);
}

  const hp = heat(), r = Math.random();
  const p1 = 0.5 - 0.3*hp, p2 = 0.33 + 0.08*hp;
  let need = r < p1 ? 1 : (r < p1+p2 ? 2 : 3);
  if (state.placed === 0) need = 1; // the first fee must land fast
  const vip = state.placed > 6 && Math.random() < vipChance();
  if (vip) need = Math.random() < 0.5 ? 2 : 3;

function every(key, gap) {
  const t = performance.now();
  if (!cool[key] || t - cool[key] > gap*1000) { cool[key] = t; return true; }
  return false;
}

function update(dt) {
  dt2 = dt;
  if (payFlash > 0) payFlash -= dt;
  if (modalOpen || gameOver) return;
  roomRec.length = 0;
  emp.recs.forEach(r => { if (r.st === 'work') roomRec[r.room] = true; });
  let mx = 0, my = 0;
  if (keys['w']||keys['arrowup']) my -= 1;
  if (keys['s']||keys['arrowdown']) my += 1;
  if (keys['a']||keys['arrowleft']) mx -= 1;
  if (keys['d']||keys['arrowright']) mx += 1;
  if (joy && (Math.abs(joy.v.x)>8 || Math.abs(joy.v.y)>8)) { mx = joy.v.x/64; my = joy.v.y/64; }
  if (tourOn) { mx = 0; my = 0; tourT += dt; if (tourT > 4.5) nextTourStep(); }
  const mm = Math.hypot(mx,my);
  player.moving = mm > 0.05 && !panelOpen && !modalOpen;
  if (player.moving || joy) idleT = 0; else idleT += dt;
  const camK = Math.min(1, dt * 6);
  camX += (player.x - camX) * camK; camY += (player.y - camY) * camK;
  clampCam();
  if (player.pop) player.pop = Math.max(0, player.pop - dt*5);
  const decay = u => { if (u.pop) u.pop = Math.max(0, u.pop - dt*5); };
  emp.sourcers.forEach(decay); emp.recs.forEach(decay); emp.ams.forEach(decay); emp.fins.forEach(decay);
  if (parts.length > 300) parts.length = 300;
  if (player.moving) {
    if (mm > 1) { mx/=mm; my/=mm; }
    player.x += mx*playerSpeed()*dt; player.y += my*playerSpeed()*dt;
    player.x = Math.max(30, Math.min(VW-30, player.x));
    player.y = Math.max(120, Math.min(VH-40, player.y));
    if (Math.abs(mx) > 0.1) player.face = mx > 0 ? 1 : -1;
    const tr = player.trail;
    if (!tr.length || dist(player.x,player.y,tr[0].x,tr[0].y) > 3) {
      tr.unshift({x:player.x, y:player.y});
      if (tr.length > 260) tr.pop();
    }
  }

  printT -= dt;
  if (printT <= 0 && printerStack.length < printCap()) {
    printerStack.push(pickResumeVert()); printT = printInterval();
  }

  const pc = rc(L.printer);
  if (dist(player.x,player.y,pc.x+55,pc.y) < 78 && player.carrying.length < carryCap() && printerStack.length && every('pk',0.12)) {
    player.carrying.push(printerStack.pop()); sPick();
  }
  const dc = rc(L.desk);
  if (built('desk') && dist(player.x,player.y,dc.x,dc.y+30) < 82 && player.carrying.length && deskQueue.length < 8 && every('dp',0.1)) {
    deskQueue.push(player.carrying.pop()); sDrop();
  }
  const shc = rc(L.shred);
  if (dist(player.x,player.y,shc.x,shc.y) < 58 && dist(player.x,player.y,pc.x+55,pc.y) >= 78 && player.carrying.length && every('shred',0.12)) {
    player.carrying.pop();
    beep(150, 0.1, 'sawtooth', 0.06); beep(110, 0.12, 'sawtooth', 0.05, 0.05);
    for (let i=0;i<7;i++) {
      const a = Math.random()*Math.PI*2, sp = 40+Math.random()*90;
      parts.push({ x:shc.x, y:shc.y-14, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp-70, life:0.5+Math.random()*0.3, col:['#FFFFFF','#D8D0BC','#B8B0A0'][i%3], sz:3+Math.random()*3 });
    }
  }
  const atDesk = dist(player.x,player.y,dc.x,dc.y+30) < 92;
  const screenRate = Math.min(2.35, 0.65 + 0.28*Math.min(4, state.hires.sourcer) + (atDesk ? 0.35 : 0) + 0.08*state.ups.staff);
  if (built('desk') && deskQueue.length && candidates.filter(c=>c.st==='wait').length < zoneCap()) {
    screenT += dt * screenRate;
    if (screenT >= screenTime()) {
      screenT = 0;
      const v = deskQueue.shift();
      if (Math.random() < rejectRate()) {
        state.rejected = (state.rejected||0) + 1;
        crossFx.push({ x:dc.x+40, y:dc.y+10, life:1.1 });
        beep(240, 0.07, 'square', 0.045);
        for (let i=0;i<5;i++) {
          const a = Math.random()*Math.PI*2, sp = 30+Math.random()*70;
          parts.push({ x:dc.x+40, y:dc.y+26, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp-60, life:0.45+Math.random()*0.25, col:['#FFFFFF','#E0B4AC'][i%2], sz:3+Math.random()*2 });
        }
      } else {
        const sl = freeZoneSlot();
        if (sl >= 0) candidates.push({ x:dc.x, y:dc.y+40, vert:v, st:'wait', slot:sl, owner:null, idx:0, bob:Math.random()*6 });
      }
    }
  } else if (!deskQueue.length) screenT = 0;

  const zc = rc(L.zone), bc2 = rc(L.booth), rdc = rc(BENCH);
  const pf = () => player_followers();
  atBooth = built('booth') && dist(player.x,player.y,bc2.x,bc2.y) < 104;
  if (dist(player.x,player.y,zc.x,zc.y) < 104 && pf().length < followCap() && every('att',0.16)) {
    const w = candidates.find(c => c.st === 'wait' && !c.claim);
    if (w) { w.st='follow'; w.owner='p'; w.waitT=0; player.pop = 1; sPick(); }
  }
  if (atBooth && built('booth') && every('bdrop', 0.18)) {
    const f = pf().filter(c => !c.done).pop();
    if (f) {
      const taken = candidates.filter(c => c.st==='booth').map(c => c.bslot);
      let bs = -1;
      for (let i = 0; i < boothCap(); i++) if (!taken.includes(i)) { bs = i; break; }
      if (bs >= 0) { f.st='booth'; f.owner=null; f.bslot=bs; f.iT=0; sDrop(); }
    }
  }
  if (dist(player.x,player.y,rdc.x,rdc.y) < 76 && pf().length < followCap() && every('attr',0.16)) {
    const r = candidates.find(c=>c.st==='ready');
    if (r) { r.st='follow'; r.owner='p'; sPick(); }
  }
  pf().forEach((f,i) => { f.idx = i; });
  if (pf().length && every('intro', 0.2)) {
    for (const cl of clients) {
      if (cl.st !== 'wait' || cl.need <= 0) continue;
      if (dist(player.x, player.y, cl.x, cl.y) > 96) continue;
      // no inFlight check here on purpose: staff reservations must never block the
      // player, who is the fastest deliverer. Their escorts rehome if the order fills.
      let f = pf().find(c => c.done && c.vert === cl.vert), off = false;
      if (!f && cl.patience < cl.maxP*0.55) { f = pf().find(c => c.done); off = true; }
      if (!f) continue;
      f.dead = true; cl.need--;
      cl.feeAcc = (cl.feeAcc || 0) + feeOf(cl.vert) * (off ? 0.55 : 1);
      confetti(cl.x, cl.y-44, VERTS[f.vert].color);
      beep(620, 0.07, 'sine', 0.07); beep(880, 0.09, 'sine', 0.07, 0.06);
      if (cl.need <= 0) {
        cl.st = 'leave'; cl.amClaim = undefined;
        const fee = cl.feeAcc * (cl.vip ? 5 : 1);
        spawnBills(fee, cl.x, cl.y + 26);
        floatTxt(cl.x, cl.y-70, '+' + fmt(fee), '#2E7D32'); sPlace();
        onPlaced();
        if (cl.vip) { confetti(cl.x, cl.y-40, '#C9A227'); floatTxt(cl.x, cl.y-96, 'VIP placed!', '#A87F14'); }
      }
      break;
    }
  }
  const drc = { x:L.door.x+L.door.w/2, y:L.door.y+L.door.h/2 };
  if (dist(player.x,player.y,drc.x,drc.y) < 74 && pf().length && every('rel',0.25)) {
    const f = pf()[pf().length-1];
    f.dead = true;
    beep(320, 0.08, 'triangle', 0.06);
  }

  candidates.forEach(c => {
    if (c.st === 'fetched') {
      // waiting for the account manager to arrive
    } else if (c.st === 'wait') {
      const s = zoneSlots[c.slot];
      c.x += (s.x-c.x)*Math.min(1, dt*6); c.y += (s.y-c.y)*Math.min(1, dt*6);
      c.waitT = (c.waitT||0) + dt;
      if (c.claim && !emp.recs[+String(c.claim).slice(3)]) c.claim = undefined; // claimer was let go
      if (!c.claim && c.waitT > 9 && every('drift' + c.slot, 1.1)) {
        const taken = candidates.filter(k => k.st==='booth').map(k => k.bslot);
        for (let i = 0; i < boothCap(); i++) {
          if (taken.includes(i)) continue;
          c.st='booth'; c.bslot=i; c.iT=0; c.waitT=0;
          break;
        }
      }
    } else if (c.st === 'booth') {
      const s = boothSlots[c.bslot];
      c.x += (s.x-c.x)*Math.min(1, dt*7); c.y += (s.y-c.y)*Math.min(1, dt*7);
      const isPlayerRoom = c.bslot === playerRoom();
      const staffed = !!roomRec[c.bslot];
      c.iT = (c.iT||0) + dt * (isPlayerRoom ? 2.2 : staffed ? 1 : 0.2);
      if (c.iT >= interviewTime()) {
        // interviews occasionally surface a mismatch - but never kick a struggling player
        if (state.cash >= REJECT_FLOOR() && Math.random() < INTERVIEW_REJECT) {
          state.rejected = (state.rejected||0) + 1;
          c.rej = true;                       // draws a red cross while they walk out
          beep(240, 0.08, 'square', 0.05);
          for (let i=0;i<5;i++) {
            const a = Math.random()*Math.PI*2, sp = 30+Math.random()*70;
            parts.push({ x:c.x, y:c.y-20, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp-60, life:0.45+Math.random()*0.25, col:['#FFFFFF','#E0B4AC'][i%2], sz:3+Math.random()*2 });
          }
          c.st = 'expire';
          return;
        }
        const rs = freeReadySpot();
        if (rs < 0) { c.iT = interviewTime(); }
        else {
          const nv = bestDemandVert(c.vert);
          if (nv !== c.vert) {
            c.vert = nv;
            confetti(c.x, c.y-24, VERTS[nv].color);
            if (every('matchmsg', 3)) floatTxt(c.x, c.y-48, 'Matched to ' + VERTS[nv].name, VERTS[nv].dark);
          }
          c.st='ready'; c.rspot=rs; c.readyT=0; c.done=true;
          beep(700, 0.08, 'sine', 0.07); beep(940, 0.1, 'sine', 0.07, 0.07);
        }
      }
    } else if (c.st === 'ready') {
      const s = readySpots[c.rspot];
      c.x += (s.x-c.x)*Math.min(1, dt*6); c.y += (s.y-c.y)*Math.min(1, dt*6);
      const buyer = clients.find(cl => cl.vert===c.vert && cl.st==='wait' && cl.need > 0);
      if (buyer) {
        c.readyT = 0;
        c.waitBuyer = (c.waitBuyer||0) + dt;
        const inFlight = candidates.filter(k => (k.st==='escort'||k.st==='fetched'||k.st==='selfgo') && k.target===buyer).length;
        if (c.waitBuyer > 5 && buyer.need - inFlight > 0) { c.st='selfgo'; c.target=buyer; c.offspec=false; }
      } else {
        c.waitBuyer = 0;
        const desperate = clients.find(cl => cl.st==='wait' && cl.need > 0 && cl.patience < cl.maxP*0.45 &&
          candidates.filter(k => (k.st==='escort'||k.st==='fetched'||k.st==='selfgo') && k.target===cl).length < cl.need);
        if (desperate && (c.readyT||0) > 3) { c.st='selfgo'; c.target=desperate; c.offspec=true; }
        c.readyT = (c.readyT||0) + dt;
        if (c.readyT > 2.5 && every('retag'+c.rspot, 1.2)) {
          const nv = bestDemandVert(c.vert);
          if (nv !== c.vert) { c.vert = nv; c.readyT = 0; confetti(c.x, c.y-24, VERTS[nv].color); }
        }
        if (c.readyT > 26) { c.st = 'expire'; floatTxt(c.x, c.y-42, 'Took another offer', '#8A7E6A'); }
      }
    } else if (c.st === 'escort') {
      const a = emp.ams[c.amIdx];
      if (!a) { rehome(c); return; }
      const tx = a.x + ((c.eIdx||0) - 1) * 26, ty = a.y + 32 + (c.eIdx||0)*4;
      const d = dist(c.x, c.y, tx, ty);
      if (d > 4) { const sp = Math.min(d*8, 330); c.x += (tx-c.x)/d*sp*dt; c.y += (ty-c.y)/d*sp*dt; }
    } else if (c.st === 'follow') {
      if (c.noDrop > 0) c.noDrop -= dt;
      const isRec = typeof c.owner === 'string' && c.owner.indexOf('rec') === 0;
      const owner = c.owner==='p' ? player : (isRec ? emp.recs[+c.owner.slice(3)] : null);
      if (!owner) { rehome(c); return; }
      const tp = c.owner==='p'
        ? (() => { const tr = owner.trail; const ti = Math.min((c.idx+1)*13, tr.length-1); return ti >= 0 && tr.length ? tr[ti] : { x:owner.x, y:owner.y }; })()
        : { x:owner.x, y:owner.y + 30 };
      const d = dist(c.x,c.y,tp.x,tp.y);
      if (d > 4) {
        const sp = Math.min(d*8, 320);
        c.x += (tp.x-c.x)/d*sp*dt; c.y += (tp.y-c.y)/d*sp*dt;
      }
    } else if (c.st === 'selfgo') {
      const t2 = c.target;
      if (!t2 || t2.dead || t2.st !== 'wait' || t2.need <= 0) { rehome(c); return; }
      const d = dist(c.x, c.y, t2.x, t2.y - 46);
      if (d < 16) {
        c.dead = true; t2.need--;
        t2.feeAcc = (t2.feeAcc || 0) + feeOf(t2.vert) * (c.offspec ? 0.55 : 1);
        confetti(t2.x, t2.y-44, VERTS[c.vert].color);
        if (t2.need <= 0) {
          t2.st = 'leave'; t2.amClaim = undefined;
          const fee = t2.feeAcc * (t2.vip ? 5 : 1);
          spawnBills(fee, t2.x, t2.y + 26);
          floatTxt(t2.x, t2.y-70, '+' + fmt(fee), '#2E7D32'); sPlace();
          onPlaced();
          if (t2.vip) { confetti(t2.x, t2.y-40, '#C9A227'); floatTxt(t2.x, t2.y-96, 'VIP placed!', '#A87F14'); }
        }
      } else { c.x += (t2.x-c.x)/d*120*dt; c.y += (t2.y-46-c.y)/d*120*dt; }
    } else if (c.st === 'expire') {
      const tx = L.door.x+45, ty = L.door.y+60;
      const d = dist(c.x,c.y,tx,ty);
      if (d < 12) c.dead = true;
      else { c.x += (tx-c.x)/d*180*dt; c.y += (ty-c.y)/d*180*dt; }
    }
  });
  candidates = candidates.filter(c => !c.dead);

  // build pads
  Object.keys(BUILD).forEach(k => {
    if (built(k)) return;
    const r = BUILD[k].rect(), c2 = { x:r.x+r.w/2, y:r.y+r.h/2 }, cost = buildCost(k);
    const key = 'b_' + k;
    if (!tourOn && !modalOpen && dist(player.x,player.y,c2.x,c2.y) < 92 && state.cash >= cost) {
      padProg[key] = (padProg[key]||0) + dt;
      if (padProg[key] >= 0.9) {
        padProg[key] = 0;
        state.cash -= cost; state.built[k] = true; sBuy();
        confetti(c2.x, c2.y-20, '#4EC0CE'); confetti(c2.x-40, c2.y, '#FFD23F');
        toast(BUILD[k].name + ' built!');
        saveGame();
      }
    } else padProg[key] = Math.max(0, (padProg[key]||0) - dt*2);
  });

  if (promoCd > 0) promoCd -= dt;
  if (rushOn) {
    rushLeft -= dt;
    if (rushLeft <= 0) { rushOn = false; promoCd = 45; }
  }
  const bnc = { x:L.banner.x+L.banner.w/2, y:L.banner.y+L.banner.h/2 };
  if (built('promo') && !rushOn && promoCd <= 0 && trading() &&
      dist(player.x,player.y,bnc.x,bnc.y) < 74 && state.cash >= promoCost()) {
    padProg.promo = (padProg.promo||0) + dt;
    if (padProg.promo >= 0.8) {
      padProg.promo = 0;
      state.cash -= promoCost();
      rushOn = true; rushLeft = 30; sBuy();
      confetti(bnc.x, bnc.y-24, '#C065A8');
    }
  } else padProg.promo = Math.max(0, (padProg.promo||0) - dt*2);


  if (built('lobby')) clientT -= dt;
  if (built('lobby') && clientT <= 0) {
    spawnClient();
    clientT = (rushOn ? 0.42 : 1) * (10.5 - 4.0*heat()) * adsFactor() + Math.random()*1.8;
  }
  if (rushBank > 0 && clients.length < clientCap() && every('rushbank', 0.8)) { rushBank--; spawnClient(); }
  clients.forEach(cl => {
    if (cl.st === 'in') {
      const s = clientSlots[cl.slot];
      const d = dist(cl.x,cl.y,s.x,s.y);
      if (d < 4) { cl.st = 'wait'; cl.total = cl.need; }
      else { cl.x += (s.x-cl.x)/d*135*dt; cl.y += (s.y-cl.y)/d*135*dt; }
    } else if (cl.st === 'wait') {
      cl.patience -= dt;
      if (cl.patience <= 0) {
        cl.st = 'leave'; sSad();
        floatTxt(cl.x, cl.y-70, 'Client left', '#B03A2E');
        state.lost++;
        cl.amClaim = undefined;
        candidates.forEach(c => { if ((c.st==='escort' || c.st==='fetched' || c.st==='selfgo') && c.target===cl) rehome(c); });
      }
    } else if (cl.st === 'leave') {
      const tx = L.door.x+45, ty = L.door.y+60;
      const d = dist(cl.x,cl.y,tx,ty);
      if (d < 8) cl.dead = true;
      else { cl.x += (tx-cl.x)/d*150*dt; cl.y += (ty-cl.y)/d*150*dt; }
    }
  });
  clients = clients.filter(c => !c.dead);

  bills.forEach(b => {
    b.t += dt;
    if (!b.fly) {

      if (dist(player.x,player.y,b.x,b.y) < 95) b.fly = 'p';
    } else {
      const isP = b.fly === 'p';
      const fu = isP ? null : emp.fins[b.fly.f];
      if (!isP && !fu) { b.fly = null; return; }
      const tx = isP ? player.x : fu.x, ty = isP ? player.y : fu.y;
      const d = dist(b.x,b.y,tx,ty);
      if (d < 22) {
        b.dead = true;
        if (isP) {
          state.cash += b.val; state.earned = (state.earned||0) + b.val; cashEverPicked = true; player.pop = 1; sCoin();
          coinFly(tx, ty);
          floatTxt(tx, ty-34, '+' + fmt(b.val), '#2E7D32');
        } else { fu.carry += b.val; fu.n++; }
      } else { b.x += (tx-b.x)/d*680*dt; b.y += (ty-b.y)/d*680*dt; }
    }
  });
  bills = bills.filter(b => !b.dead);

  const playerAtBoard = dist(player.x, player.y, pc.x+55, pc.y) < 110 && player.carrying.length < carryCap();
  emp.sourcers.forEach(s => {
    const ox = (s.o - (emp.sourcers.length-1)/2) * 26;
    if (s.st === 'idle') { if (printerStack.length && !playerAtBoard) s.st = 'toP'; }
    else if (s.st === 'toP') {
      const tx = pc.x+55+ox, ty = pc.y+34;
      const d = dist(s.x,s.y,tx,ty);
      if (d < 14) {
        if (!playerAtBoard) while (s.carrying.length < sourcerCarry() && printerStack.length) s.carrying.push(printerStack.pop());
        s.st = s.carrying.length ? 'toD' : 'idle';
      } else { const sv = staffSpeed(); s.x += (tx-s.x)/d*sv*dt; s.y += (ty-s.y)/d*sv*dt; }
    } else if (s.st === 'toD') {
      const tx = dc.x-30+ox, ty = dc.y+40;
      const d = dist(s.x,s.y,tx,ty);
      if (d < 14) {
        if (deskQueue.length < 8) { deskQueue.push(s.carrying.pop()); if (!s.carrying.length) s.st = 'idle'; }
      } else { const sv = staffSpeed(); s.x += (tx-s.x)/d*sv*dt; s.y += (ty-s.y)/d*sv*dt; }
    }
  });
  emp.recs.forEach(r => {
    const slot = boothSlots[r.room];
    if (!slot) return;
    const px2 = slot.x + 30, py2 = L.booth.y + 40;
    const roomBusy = candidates.some(c => c.st === 'booth' && c.bslot === r.room);
    if (r.st === 'idle') r.st = 'toRoom';
    if (r.st === 'toRoom') {
      r.mv = true;
      if (moveToward(r, px2, py2, staffSpeed(), dt, 6)) { r.st = 'work'; r.mv = false; }
    } else if (r.st === 'work') {
      r.mv = false;
      const playerAtZone = dist(player.x, player.y, zc.x, zc.y) < 120 && pf().length < followCap();
      if (!roomBusy && !playerAtZone && every('recfetch' + r.o, 0.6)) {
        const w = candidates.find(c => c.st === 'wait' && !c.claim);
        if (w) { w.claim = 'rec' + r.o; r.target = w; r.st = 'fetch'; }
      }
    } else if (r.st === 'fetch') {
      r.mv = true;
      const c = r.target;
      if (!c || c.dead || c.st !== 'wait' || c.claim !== 'rec' + r.o) {
        if (c && c.claim === 'rec' + r.o) c.claim = undefined;
        r.target = null; r.st = 'toRoom';
      } else if (moveToward(r, c.x, c.y, staffSpeed(), dt, 16)) {
        c.st = 'follow'; c.owner = 'rec' + r.o; c.claim = undefined; c.waitT = 0; r.pop = 1; sPick();
        r.st = 'lead';
      }
    } else if (r.st === 'lead') {
      r.mv = true;
      const c = r.target;
      if (!c || c.dead || c.owner !== 'rec' + r.o) { r.target = null; r.st = 'toRoom'; }
      else if (moveToward(r, px2, py2, staffSpeed(), dt, 10)) {
        r.target = null;
        if (!candidates.some(k => k.st === 'booth' && k.bslot === r.room)) {

    ctx.fillText('×' + cl.need, p2.x-2, p2.y+1);
    const pf = Math.max(0, cl.patience / cl.maxP);
    ctx.fillStyle = 'rgba(60,50,35,0.22)'; rr(p2.x-31, p2.y+17, 62, 6, 3); ctx.fill();
    ctx.fillStyle = pf > 0.5 ? '#7DBB6C' : pf > 0.25 ? '#E8A020' : '#D9534F';
    rr(p2.x-31, p2.y+17, Math.max(4, 62*pf), 6, 3); ctx.fill();
    if (cl.vip) {
      ctx.fillStyle = '#C9A227'; rr(p2.x+24, p2.y-36, 44, 19, 9); ctx.fill();
      ctx.fillStyle = '#FFFDF4'; ctx.font = '700 11px Fredoka, sans-serif'; ctx.textAlign = 'center';
      ctx.fillText('VIP x5', p2.x+46, p2.y-22);
    }
  });

  // ---- staff role letters ----
  [[emp.sourcers,'S'],[emp.recs,'R'],[emp.ams,'A'],[emp.fins,'F']].forEach(pair => pair[0].forEach(u => {
    const p2 = proj(u.x, u.y, 46);
    if (!onScreen(p2)) return;
    ctx.fillStyle = '#FFFFFF'; ctx.beginPath(); ctx.arc(p2.x+14, p2.y, 9, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = STAFF_UNIFORM; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.arc(p2.x+14, p2.y, 9, 0, Math.PI*2); ctx.stroke();
    ctx.fillStyle = STAFF_UNIFORM; ctx.font = '700 11px Fredoka, sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(pair[1], p2.x+14, p2.y+4);
  }));

  // ---- that one is you ----
  {
    const p2 = proj(player.x, player.y, 116);
    const pu = (Math.sin(performance.now()/300)+1)/2;
    ctx.fillStyle = '#FFD23F';
    ctx.beginPath();
    ctx.moveTo(p2.x, p2.y + 15 + pu*3); ctx.lineTo(p2.x-12, p2.y - 2 + pu*3); ctx.lineTo(p2.x+12, p2.y - 2 + pu*3);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#8A5410'; ctx.lineWidth = 2.5; ctx.stroke();
  }

  // ---- guidance arrow ----
  if (state.tut < TUT.length && !tourOn) {
    const tg = TUT[state.tut].tgt();
    const p2 = proj(tg.x, tg.y, 130 + Math.sin(performance.now()/220)*10);
    if (onScreen(p2)) {
      ctx.fillStyle = '#5FD16A';
      ctx.beginPath();
      ctx.moveTo(p2.x, p2.y + 21); ctx.lineTo(p2.x-16, p2.y); ctx.lineTo(p2.x+16, p2.y);
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle = '#2A8C39'; ctx.lineWidth = 3; ctx.stroke();
    }
  }
  if (player_followers().some(c => c.done)) {
    const target = clients.find(cl => cl.st === 'wait' && cl.need > 0);
    if (target) {
      const p2 = proj(target.x, target.y, 160);
      if (onScreen(p2)) {
        ctx.fillStyle = '#8A6410'; ctx.font = '600 13px Fredoka, sans-serif'; ctx.textAlign = 'center';
        ctx.fillText('wants ' + VERTS[target.vert].name, p2.x, p2.y);
      }
    }
  }

  // ---- effects ----
  parts.forEach(q => {
    const s2 = proj(q.x, q.y, 46);
    ctx.globalAlpha = Math.min(1, q.life*1.6);
    ctx.fillStyle = q.col; ctx.fillRect(s2.x-q.sz/2, s2.y-q.sz/2, q.sz, q.sz);
    ctx.globalAlpha = 1;
  });
  crossFx.forEach(c => { const s2 = proj(c.x, c.y, 66); drawCross(s2.x, s2.y, 11, Math.min(1, c.life*1.6)); });
  const chipS = cashChipScreen();
  coinFx.forEach(c => {
    if (c.t < 0) return;
    const k = Math.min(1, c.t / c.dur), e2 = k*k*(3-2*k);
    const s0 = proj(c.x0, c.y0, 24);
    const cx2 = s0.x + (chipS.x - s0.x)*e2, cy2 = s0.y + (chipS.y - s0.y)*e2 - Math.sin(k*Math.PI)*70;
    ctx.fillStyle = '#FFC93C'; ctx.beginPath(); ctx.arc(cx2, cy2, 9, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#FFE9A8'; ctx.beginPath(); ctx.arc(cx2-3, cy2-3, 3.4, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#C9922A'; ctx.lineWidth = 1.6; ctx.beginPath(); ctx.arc(cx2, cy2, 9, 0, Math.PI*2); ctx.stroke();
  });
  floaters.forEach(f => {
    const s2 = proj(f.x, f.y, 96);
    ctx.globalAlpha = Math.min(1, f.life*1.8);
    ctx.font = '700 17px Fredoka, sans-serif'; ctx.textAlign = 'center';
    ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(255,255,255,0.85)';
    ctx.strokeText(f.txt, s2.x, s2.y);
    ctx.fillStyle = f.col; ctx.fillText(f.txt, s2.x, s2.y);
    ctx.globalAlpha = 1;
  });

  // ---- screen furniture ----
  ctx.font = '500 12px Fredoka, sans-serif'; ctx.textAlign = 'right';
  ctx.fillStyle = 'rgba(80,55,110,0.55)';
  ctx.fillText('Placed ' + state.placed + '   Rejected ' + (state.rejected||0) + '   Lost ' + state.lost, cssW-12, cssH-12);

  if (payFlash > 0) {
    ctx.fillStyle = 'rgba(210,80,60,' + Math.min(0.28, payFlash*0.22) + ')';
    ctx.fillRect(0, 0, cssW, cssH);
  }
  let pillY = 128;
  if (rushOn) {
    const pulse = 0.75 + Math.sin(performance.now()/160)*0.2;
    ctx.font = '700 15px Fredoka, sans-serif'; ctx.textAlign = 'center';
    const label = 'PROMO  fees x1.5  ' + Math.ceil(rushLeft) + 's';
    const bw = ctx.measureText(label).width + 30;
    ctx.fillStyle = 'rgba(200,80,40,' + (0.82 + 0.16*pulse) + ')';
    rr(cssW/2 - bw/2, pillY, bw, 30, 15); ctx.fill();
    ctx.fillStyle = '#FFF3D6'; ctx.fillText(label, cssW/2, pillY + 20);
    pillY += 36;
  }
  if (state.fast) {
    ctx.font = '700 14px Fredoka, sans-serif'; ctx.textAlign = 'center';
    const bl = '⚡ 2x';
    const bbw = ctx.measureText(bl).width + 24;
    ctx.fillStyle = 'rgba(30,110,128,0.9)';
    rr(cssW/2 - bbw/2, pillY, bbw, 27, 13); ctx.fill();
    ctx.fillStyle = '#EAFBFF'; ctx.fillText(bl, cssW/2, pillY + 18);
  }

  if (tourOn) drawTour();

  if (joy) {
    ctx.globalAlpha = 0.3;
    ctx.strokeStyle = '#FFF6E4'; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.arc(joyScreen.x, joyScreen.y, 54, 0, Math.PI*2); ctx.stroke();
    ctx.globalAlpha = 0.75;
    const jx = joyScreen.x + joy.v.x, jy = joyScreen.y + joy.v.y;
    const kg = ctx.createRadialGradient(jx-6, jy-8, 4, jx, jy, 26);
    kg.addColorStop(0, '#FFFDF4'); kg.addColorStop(1, '#E5D9BC');
    ctx.fillStyle = kg;
    ctx.beginPath(); ctx.arc(jx, jy, 25, 0, Math.PI*2); ctx.fill();
    ctx.globalAlpha = 1;
  } else if (isCoarse && idleT > 4 && !modalOpen && !panelOpen) {
    const pu = (Math.sin(performance.now()/300)+1)/2;
    ctx.globalAlpha = 0.35 + 0.3*pu;
    ctx.strokeStyle = '#FFF6E4'; ctx.lineWidth = 3;
    const hy2 = cssH - 150;
    ctx.beginPath(); ctx.arc(cssW/2, hy2, 40 + 7*pu, 0, Math.PI*2); ctx.stroke();
    ctx.fillStyle = '#FFF6E4'; ctx.textAlign = 'center';
    ctx.font = '600 30px Fredoka, sans-serif'; ctx.fillText('☝', cssW/2, hy2 + 10);
    ctx.font = '600 15px Fredoka, sans-serif'; ctx.fillText('drag to walk', cssW/2, hy2 + 56);
    ctx.globalAlpha = 1;
  }
}

let lastT = 0, saveT = 0;
function loop(t) {
  const dt = Math.min(0.05, (t - lastT)/1000 || 0.016);
  lastT = t;
  update(dt * timeScale());
  render();
  const cEl = $('cash'), cNum = $('cashNum'), cTxt = fmt(state.cash);
  const cCol = state.cash < 0 ? '#8A2418' : '';
  if (cEl._col !== cCol) { cEl._col = cCol; cEl.style.color = cCol; }
  if (cNum.textContent !== cTxt) {
    cNum.textContent = cTxt;
    cEl.classList.add('pop');
    clearTimeout(cEl._p); cEl._p = setTimeout(() => cEl.classList.remove('pop'), 130);
  }
  const pr = passiveRate();
  const pc = $('payChip');
  const ph = payrollOn() ? '\u{1F4B8} ' + fmt(monthlyDue()) + ' in ' + Math.ceil(state.payT) + 's' : '\u00a0';
  if (pc._h !== ph) { pc._h = ph; pc.innerHTML = ph; }
  const pcol = (payrollOn() && state.cash < monthlyDue()) ? '#B4231A' : '#8A5A06';
  if (pc._c !== pcol) { pc._c = pcol; pc.style.color = pcol; }
  const ob = $('objective');
  if (state.tut < TUT.length && !tourOn) {
    const task = TUT[state.tut];
    ob.style.display = 'flex';
    if (ob._t !== task.txt) {
      ob._t = task.txt;
      $('objText').textContent = task.txt;
      $('objIcon').textContent = task.icon || '\u{1F4CC}';
    }
    const prog = task.done() ? 1 : 0;
    if (ob._p !== prog) { ob._p = prog; $('objFill').style.width = (prog*100) + '%'; }
  } else ob.style.display = 'none';
  const lb = $('lvlBar'), xp = state.xp || 0, lv = lvlOf(xp), into = xp % XP_PER_LEVEL;
  if (lb._v !== xp) {
    lb._v = xp;
    $('lvlNum').textContent = lv;
    $('lvlFill').style.width = (into / XP_PER_LEVEL * 100) + '%';
    $('lvlTxt').textContent = into + '/' + XP_PER_LEVEL;
  }
  if (panelOpen && every('pnl', 0.5)) {
    panelBtns.forEach(x => {
      const can = state.cash >= x.cost;
      x.el.disabled = !can;
      if (x.vert) {
        x.el.style.background = can ? VERTS[x.vert].color : 'linear-gradient(#D6CCE2,#B9AAC8)';
        x.el.style.boxShadow = can ? '0 3px 0 ' + VERTS[x.vert].dark : '0 3px 0 #9C8CB0';
      }
    });
    $('panelCash').textContent = fmt(state.cash);
  }
  saveT += dt;
  if (saveT > 8) { saveT = 0; saveGame(); }
  requestAnimationFrame(loop);
}

document.addEventListener('visibilitychange', () => { if (document.hidden) saveGame(); });

(async function boot() {
  init3D();
  resize();
  let wiped = false;
  try {
    if (/[?&#]reset\b/.test(location.search + location.hash)) { await wipeSave(); wiped = true; }
  } catch(e) {}
  const loaded = wiped ? null : await loadGame();
  if (loaded && typeof loaded.cash === 'number' && isFinite(loaded.cash)) {
    state = Object.assign(freshState(), loaded);
    state.ups = Object.assign(freshOffice().ups, loaded.ups || {});
    state.hires = Object.assign(freshOffice().hires, loaded.hires || {});
    state.country = Math.min(COUNTRIES.length-1, Math.max(0, loaded.country|0));
    state.tut = Math.min(TUT.length, Math.max(0, loaded.tut|0));
    state.placed = Math.max(0, loaded.placed|0);
    state.verts = (Array.isArray(loaded.verts) ? loaded.verts : ['bc']).filter(v => VERTS[v]);
    if (!state.verts.length) state.verts = ['bc'];
    Object.keys(HIRES).forEach(k => { state.hires[k] = Math.max(0, Math.min(HIRES[k].max, +state.hires[k] || 0)); });
    Object.keys(UPS).forEach(k => { state.ups[k] = Math.max(0, Math.min(UPS[k].max, +state.ups[k] || 0)); });
    state.lost = Math.max(0, loaded.lost|0);
    state.rejected = Math.max(0, loaded.rejected|0);
    state.payOn = !!loaded.payOn;
    state.fast = !!loaded.fast;
    state.xp = Math.max(0, loaded.xp|0);
    state.built = Object.assign({}, loaded.built || {});
    if (!loaded.built && (state.placed > 0 || state.tut > 0)) buildAll();   // pre-build-system saves
    state.earned = Math.max(0, +loaded.earned || 0);
    state.payT = (typeof loaded.payT === 'number' && loaded.payT > 0) ? Math.min(MONTH, loaded.payT) : MONTH;
    state.months = Math.max(0, loaded.months|0);
    // migrations for saves older than v1
    delete state.ups.culture; delete state.chain; delete state.debt;
    state.v = 1;
    state.offices = {};
    if (loaded.offices) Object.keys(loaded.offices).forEach(k => {
      const i = +k;
      if (i >= 0 && i < COUNTRIES.length && i !== state.country) state.offices[i] = loaded.offices[k];
    });
    delete state.hires.mkt;
    syncEmp();
    const mins = Math.min(360, (Date.now() - (loaded.ts || Date.now()))/60000);
    const gain = passiveRate() * mins;
    if (gain >= 1) {
      state.cash += gain; state.earned = (state.earned||0) + gain;
      showModal('Welcome back', 'While you were away, your HQ offices earned <b>' + fmt(gain) + '</b>.', [{ label:'Collect', pri:true }]);
    }
  } else {
    state = freshState();
  }
  resetFloor();
  applyHud();
  cv.tabIndex = 0;
  setTimeout(() => { try { cv.focus(); } catch(e) {} }, 150);
  const sp = $('splash');
  if (sp && sp.classList) {
    const started = state.placed > 0 || state.tut > 0;
    const play = $('spPlay'), snd = $('spSnd');
    if (play) play.textContent = started ? 'Continue' : 'Play';
    const setSnd = () => { if (snd) snd.textContent = 'Sound: ' + (state.mute ? 'off' : 'on'); };
    setSnd();
    const leave = fn => { ensureAC(); sp.classList.add('gone'); if (fn) fn(); };
    if (play) play.onclick = () => leave(() => {
      try { if (matchMedia('(pointer: coarse)').matches) toast('Drag anywhere to walk'); } catch(e) {}
    });
    const tour = $('spTour');
    if (tour) tour.onclick = () => leave(startTour);
    const nw = $('spNew');
    if (nw) nw.onclick = () => {
      showModal('Start a new game?', 'This wipes your current save.',
        [ { label:'Cancel' },
          { label:'Yes, new game', pri:true, fn: () => {
              state = freshState(); resetFloor(); gameOver = false;
              cashEverPicked = false; hintIT = false; hintHC = false;
              applyHud(); saveGame(); leave(startTour);
            } } ]);
    };
    if (snd) snd.onclick = () => { state.mute = !state.mute; setSnd(); saveGame(); };
  }
  requestAnimationFrame(loop);
})();
</script>
