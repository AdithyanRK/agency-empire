<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Agency Empire" />
  <meta name="theme-color" content="#241F17" />
<title>Agency Empire</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink:#3B3227; --ink2:#6E6250; --paper:#FFF9EE; --card:#FFFFFF;
    --line:#EFE4CC; --gold:#FFC93C; --gold-d:#D9A31B; --gold-ink:#7A5A08;
    --buy:#58B368; --buy-d:#3E8E4A; --danger:#E25C4A; --shade:rgba(59,50,39,0.55);
  }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; overflow:hidden; background:#241F17; font-family:'Fredoka',system-ui,sans-serif; }
  body { display:flex; align-items:center; justify-content:center; }
  #wrap { position:relative; }
  canvas { display:block; touch-action:none; }
  .hud { position:absolute; top:0; left:0; right:0; padding:calc(10px + env(safe-area-inset-top, 0px)) calc(12px + env(safe-area-inset-right, 0px)) 10px calc(12px + env(safe-area-inset-left, 0px)); display:flex; align-items:flex-start; justify-content:space-between; pointer-events:none; z-index:5; }
  .chip { background:var(--shade); backdrop-filter:blur(3px); color:#FFF6E4; border-radius:16px; padding:8px 13px; font-size:14px; font-weight:600; line-height:1.2; box-shadow:0 3px 0 rgba(0,0,0,0.18); }
  .chip small { display:block; font-size:11px; opacity:0.8; font-weight:500; }
  #cash { display:flex; align-items:center; gap:8px; font-size:23px; font-weight:700; color:var(--gold-ink); background:linear-gradient(#FFE9A8,#FFD75E); padding:7px 18px 7px 12px; border-radius:22px; box-shadow:0 4px 0 var(--gold-d), 0 6px 12px rgba(0,0,0,0.25); transition:transform 0.12s; }
  #cash.pop { transform:scale(1.08); }
  #cash::before { content:''; width:22px; height:22px; border-radius:50%; background:radial-gradient(circle at 35% 30%, #FFE9A8, #E8B93C 60%, #C9922A); box-shadow:inset 0 -2px 0 rgba(0,0,0,0.15); }
  .hbtns { display:flex; gap:8px; }
  .hbtn { pointer-events:auto; width:42px; height:42px; border-radius:50%; border:none; background:var(--shade); backdrop-filter:blur(3px); color:#FFF6E4; font-size:17px; font-weight:600; cursor:pointer; font-family:inherit; box-shadow:0 3px 0 rgba(0,0,0,0.22); }
  .hbtn:active { transform:translateY(2px); box-shadow:0 1px 0 rgba(0,0,0,0.22); }
  #objective { position:absolute; top:112px; left:50%; transform:translateX(-50%); background:var(--paper); color:var(--ink); padding:9px 18px; border-radius:16px; font-size:14px; font-weight:600; z-index:5; pointer-events:none; white-space:nowrap; box-shadow:0 4px 0 rgba(59,50,39,0.18), 0 6px 14px rgba(0,0,0,0.2); }
  #toast { position:absolute; bottom:calc(26px + env(safe-area-inset-bottom, 0px)); left:50%; transform:translateX(-50%); background:var(--shade); backdrop-filter:blur(3px); color:#FFF6E4; padding:11px 20px; border-radius:16px; font-size:14px; font-weight:500; z-index:8; pointer-events:none; opacity:0; transition:opacity 0.3s, transform 0.3s; box-shadow:0 4px 0 rgba(0,0,0,0.2); }
  .ov { position:absolute; inset:0; background:rgba(20,16,10,0.5); z-index:10; display:none; align-items:flex-end; justify-content:center; }
  .ov.show { display:flex; }
  .card { background:var(--paper); width:100%; max-height:82%; border-radius:26px 26px 0 0; padding:10px 14px 24px; overflow-y:auto; box-shadow:0 -8px 30px rgba(0,0,0,0.3); }
  .handle { width:44px; height:5px; border-radius:3px; background:#D8CCB2; margin:2px auto 10px; }
  .phead { display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
  .phead h2 { font-size:19px; color:var(--ink); }
  .pcash { font-size:15px; font-weight:700; color:var(--gold-ink); background:linear-gradient(#FFE9A8,#FFD75E); padding:5px 13px; border-radius:14px; box-shadow:0 2px 0 var(--gold-d); }
  .tabs { display:flex; gap:6px; background:#EFE6D2; padding:5px; border-radius:16px; margin-bottom:12px; }
  .tab { flex:1; border:none; font-family:inherit; font-size:14px; font-weight:600; color:var(--ink2); background:transparent; padding:9px 4px; border-radius:12px; cursor:pointer; }
  .tab.on { background:var(--card); color:var(--ink); box-shadow:0 2px 0 rgba(59,50,39,0.12); }
  .row { display:none; align-items:center; gap:11px; background:var(--card); border:1px solid var(--line); border-radius:16px; padding:10px 11px; margin-bottom:8px; box-shadow:0 2px 0 rgba(59,50,39,0.06); }
  .card.t-team .row.tb-team, .card.t-ups .row.tb-ups, .card.t-verts .row.tb-verts { display:flex; }
  .cat { display:none; font-size:11px; font-weight:700; letter-spacing:0.1em; text-transform:uppercase; color:#A8987A; margin:10px 4px 6px; }
  .card.t-ups .cat.tb-ups { display:block; }
  .tile { flex:none; width:42px; height:42px; border-radius:13px; display:flex; align-items:center; justify-content:center; font-size:17px; font-weight:700; color:#fff; box-shadow:inset 0 -3px 0 rgba(0,0,0,0.18); }
  .row .info { flex:1; min-width:0; }
  .row .nm { font-size:14.5px; font-weight:600; color:var(--ink); }
  .row .ds { font-size:12px; color:var(--ink2); }
  .pips { display:flex; gap:3px; margin-top:4px; }
  .pip { width:15px; height:5px; border-radius:3px; background:#E9DEC4; }
  .pip.on { background:var(--gold-d); }
  .buy { border:none; border-radius:13px; padding:10px 14px; font-family:inherit; font-size:14px; font-weight:700; color:#fff; background:linear-gradient(#6BC47A,var(--buy)); box-shadow:0 3px 0 var(--buy-d); cursor:pointer; white-space:nowrap; min-width:72px; }
  .buy:active { transform:translateY(2px); box-shadow:0 1px 0 var(--buy-d); }
  .buy:disabled { background:#D5CBB4; box-shadow:0 3px 0 #B8AD94; color:#FFFDF6; cursor:default; }
  .buy.max { background:linear-gradient(#C9BFA6,#B4A98E); box-shadow:0 3px 0 #9A8F76; }
  .buy:focus-visible, .tab:focus-visible, .hbtn:focus-visible { outline:3px solid #7AB8FF; outline-offset:2px; }
  .closeb { width:100%; margin-top:10px; border:none; border-radius:16px; padding:14px; font-family:inherit; font-size:15px; font-weight:700; background:var(--ink); color:#FFF6E4; cursor:pointer; box-shadow:0 4px 0 #201A12; }
  .closeb:active { transform:translateY(2px); box-shadow:0 2px 0 #201A12; }
  .mcard { background:var(--paper); border-radius:22px; padding:24px 20px; margin:0 22px; max-width:360px; text-align:center; align-self:center; box-shadow:0 10px 30px rgba(0,0,0,0.35); }
  .ov.center { align-items:center; }
  .mcard h2 { font-size:20px; color:var(--ink); margin-bottom:8px; }
  .mcard p { font-size:14px; color:var(--ink2); line-height:1.5; margin-bottom:18px; }
  .mrow { display:flex; gap:10px; }
  .mbtn { flex:1; border:none; border-radius:14px; padding:13px; font-family:inherit; font-size:15px; font-weight:700; cursor:pointer; }
  .mbtn.pri { background:linear-gradient(#6BC47A,var(--buy)); color:#fff; box-shadow:0 3px 0 var(--buy-d); }
  .mbtn.sec { background:#EDE3CC; color:#5C5240; box-shadow:0 3px 0 #D3C6A8; }
  .mbtn:active { transform:translateY(2px); box-shadow:none; }
  @media (prefers-reduced-motion: reduce) { #cash, #toast, .buy, .mbtn, .closeb, .hbtn { transition:none; } }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>
  <div class="hud">
    <div class="chip" id="countryChip">India office<small id="passiveTxt"></small></div>
    <div class="chip" id="payChip" style="position:absolute;left:50%;top:62px;transform:translateX(-50%);white-space:nowrap">Payroll</div>
    <div id="cash">$0</div>
    <div class="hbtns">
      <button class="hbtn" id="sndBtn">&#128266;</button>
    </div>
  </div>
  <div id="objective"></div>
  <div id="toast"></div>
  <div class="ov" id="panel">
    <div class="card t-team" id="panelCard">
      <div class="handle"></div>
      <div class="phead"><h2>Manager desk</h2><div class="pcash" id="panelCash">$0</div></div>
      <div class="tabs">
        <button class="tab on" data-tab="team" id="tabTeam">Team</button>
        <button class="tab" data-tab="ups" id="tabUps">Upgrades</button>
        <button class="tab" data-tab="verts" id="tabVerts">Industries</button>
      </div>
      <div id="panelRows"></div>
      <button class="closeb" id="panelClose">Back to the floor</button>
    </div>
  </div>
  <div class="ov center" id="modal">
    <div class="mcard">
      <h2 id="mTitle"></h2>
      <p id="mBody"></p>
      <div class="mrow" id="mBtns"></div>
    </div>
  </div>
</div>
<script>
'use strict';
const VW = 820, VH = 1120;
const cv = document.getElementById('game');
let ctx = cv.getContext('2d');
const wrap = document.getElementById('wrap');

const VERTS = {
  bc: { name:'Trades', color:'#B15B3E', dark:'#6B3120', fee:17 },
  it: { name:'IT staffing', color:'#4A90D9', dark:'#1E4E82', fee:40 },
  hc: { name:'Healthcare', color:'#2FA98C', dark:'#125E4B', fee:82 }
};
const VERTCOST = { it:350, hc:1150 };
const COUNTRIES = [
  { name:'India',  mul:1,  floorA:'#F2E8D2', floorB:'#EADFC2', wall:'#B99B6B', accent:'#C96F3B', sky:'rgba(150,205,230,0.6)', rug:'rgba(255,252,244,0.5)', passive:2,   moveCost:2400  },
  { name:'Dubai',  mul:2.4,  floorA:'#F6E9C6', floorB:'#EFDEAE', wall:'#C0A45C', accent:'#C9A227', sky:'rgba(240,200,140,0.6)', rug:'rgba(255,250,232,0.5)', passive:9,   moveCost:25000 },
  { name:'USA',    mul:6, floorA:'#EAEEF4', floorB:'#DEE4EC', wall:'#8FA2B8', accent:'#3B6FB5', sky:'rgba(120,170,215,0.6)', rug:'rgba(252,253,255,0.55)', passive:26,  moveCost:Infinity }
];
const UPS = {
  speed:    { name:'Founder hustle',  base:40,  mult:1.7,  max:6, desc:'You move 12% faster' },
  cap:      { name:'Carry capacity',  base:60,  mult:1.8,  max:5, desc:'+1 resume carried, +1 follower' },
  staff:    { name:'Staff speed',     base:150, mult:1.95, max:5, desc:'Staff move 18% faster' },
  staffcap: { name:'Staff capacity',  base:200, mult:1.95, max:4, desc:'Staff carry and lead more' },
  quality:  { name:'Sourcing quality',base:170, mult:1.95, max:5, desc:'Fewer resumes rejected at screening' },
  printer:  { name:'Job board plan',  base:60,  mult:1.8,  max:6, desc:'Resumes print faster' },
  screen:   { name:'AI resume screening', base:80, mult:1.8, max:6, desc:'Screening runs faster' },
  aiint:    { name:'AI phone screener', base:220, mult:1.9, max:5, desc:'Interviews run 18% faster' },
  ads:      { name:'Ad campaigns',    base:100, mult:1.85, max:6, desc:'Clients arrive 8% faster' },
  rep:      { name:'Employer brand',  base:120, mult:2.05, max:4, desc:'Fees +15% per level' },
  patience: { name:'Client lounge',   base:80,  mult:1.9,  max:4, desc:'Clients wait 20% longer' },
  vipnet:   { name:'Premium network', base:250, mult:2.0,  max:3, desc:'+3% chance of VIP clients (they pay 5x)' },
  zone:     { name:'Waiting area',    base:90,  mult:1.8,  max:3, desc:'+2 screened candidate spots' },
  ready:    { name:'Placement bench', base:110, mult:1.85, max:2, desc:'+2 ready candidate spots' },
  slots:    { name:'Client desks',    base:400, mult:2.0,  max:1, desc:'One more client can wait' },
  booth:    { name:'Interview rooms', base:180, mult:1.85, max:3, desc:'+1 interview room' },
};
const UPCATS = [
  ['Founder', ['speed','cap']],
  ['Team', ['staff','staffcap','quality']],
  ['Software', ['printer','screen','aiint']],
  ['Marketing', ['ads','rep','patience','vipnet']],
  ['Office', ['booth','zone','ready','slots']]
];
const STAFF_UNIFORM = '#4A5160';
const ROLE_TAG = { sourcer:'S', rec:'R', am:'A', fin:'F' };
const SALARY = { sourcer:34, rec:46, am:58, fin:40 };
const MONTH = 45;
const HIRES = {
  sourcer: { name:'Sourcer',         cost:180, max:4, desc:'Ferries resumes to screening' },
  rec:     { name:'Recruiter',       cost:120, max:4, desc:'Runs a room and fetches candidates' },
  am:      { name:'Account manager', cost:400, max:4, desc:'Introduces ready candidates to clients' },
  fin:     { name:'Finance exec',    cost:320, max:1, desc:'Collects and banks your fees' }
};
const L = {
  printer: { x:72,  y:126, w:164, h:96 },
  desk:    { x:494, y:126, w:210, h:96 },
  zone:    { x:486, y:274, w:250, h:150 },
  booth:   { x:296, y:456, w:448, h:136 },
  lobby:   { x:236, y:898, w:496, h:152 },
  door:    { x:20,  y:962, w:88,  h:120 },
  mgr:     { x:62,  y:452, w:170, h:100 },
  banner:  { x:74,  y:716, w:102, h:80 },
  pads:    { sourcer:{x:280,y:250}, rec:{x:370,y:420}, am:{x:330,y:760}, fin:{x:660,y:800} },
  shred:   { x:20,  y:142, w:64, h:58 },
  exit:    { x:648, y:32,  w:150, h:66 }
};
const boothSlots = [];
for (let i=0;i<6;i++) boothSlots.push({ x:340+i*66, y:534 });
const readySpots = [];
for (let i=0;i<6;i++) readySpots.push({ x:340+i*66, y:668 });
const zoneSlots = [];
for (let r=0;r<3;r++) for (let c=0;c<4;c++) zoneSlots.push({ x:522+c*60, y:314+r*46 });
const clientSlots = [ {x:316,y:992}, {x:428,y:992}, {x:540,y:992}, {x:652,y:992} ];

let state = null;
function freshOffice() {
  return { ups:{speed:0,cap:0,staff:0,staffcap:0,quality:0,printer:0,screen:0,aiint:0,ads:0,rep:0,patience:0,vipnet:0,booth:0,zone:0,ready:0,slots:0}, hires:{sourcer:0,rec:0,am:0,fin:0}, verts:['bc'], placed:0, lost:0, rejected:0 };
}
function freshState() {
  return Object.assign({ v:1, cash:START_CASH, earned:0, country:0, tut:0, mute:false, ts:Date.now(), offices:{}, payOn:false, payT:MONTH, months:0 }, freshOffice());
}
const OFFICE_KEYS = ['ups','hires','verts','placed','lost','rejected'];
function snapshotOffice() {
  const o = {};
  OFFICE_KEYS.forEach(k => { o[k] = JSON.parse(JSON.stringify(state[k])); });
  return o;
}
function applyOffice(o) {
  const f = freshOffice();
  OFFICE_KEYS.forEach(k => { state[k] = (o && o[k] !== undefined) ? JSON.parse(JSON.stringify(o[k])) : f[k]; });
  state.ups = Object.assign(f.ups, state.ups);
  state.hires = Object.assign(f.hires, state.hires);
  // stored office blobs are never validated on the way in - clamp them here
  Object.keys(UPS).forEach(k => { state.ups[k] = Math.max(0, Math.min(UPS[k].max, +state.ups[k] || 0)); });
  Object.keys(HIRES).forEach(k => { state.hires[k] = Math.max(0, Math.min(HIRES[k].max, +state.hires[k] || 0)); });
  if (!Array.isArray(state.verts) || !state.verts.length) state.verts = ['bc'];
  state.verts = state.verts.filter(v => VERTS[v]);
  if (!state.verts.length) state.verts = ['bc'];
}
function ownedOffices() { return Object.keys(state.offices || {}).map(Number).concat([state.country]).filter((v,i,a)=>a.indexOf(v)===i).sort(); }
function travelTo(idx) {
  if (idx === state.country) return;
  state.offices[state.country] = snapshotOffice();
  state.country = idx;
  applyOffice(state.offices[idx]);
  resetFloor(); applyHud(); saveGame();
  toast('Welcome back to the ' + COUNTRIES[idx].name + ' office');
}

let player, printerStack, deskQueue, screenT, candidates, clients, bills, parts, floaters;
let emp, clientT, printT, cashEverPicked, panelLatch, exitLatch, hintIT, hintHC;
let padProg, rushOn, rushLeft, promoCd, shredA = 0, dt2 = 0.016, payFlash = 0, payLast = 0, gameOver = false;
let rushBank = 0;  // promo-rush client spawns held back by a full lobby
let coinFx = [];
let chipPos = null, chipKey = '';
function cashChipWorld() {
  const key = innerWidth + 'x' + innerHeight;
  if (!chipPos || chipKey !== key) {
    chipKey = key;
    chipPos = { x: VW/2, y: -OFFY + 46/scaleF };   // sensible fallback
    try {
      const r = $('cash').getBoundingClientRect();
      const cr = cv.getBoundingClientRect();
      if (r.width) chipPos = { x: (r.left + r.width/2 - cr.left)/scaleF - OFFX,
                               y: (r.top + r.height/2 - cr.top)/scaleF - OFFY };
    } catch(e) {}
  }
  return chipPos;
}
function coinFly(x, y) {
  for (let i = 0; i < 3; i++) coinFx.push({
    x0: x + Math.random()*30 - 15, y0: y + Math.random()*20 - 10,
    t: -i*0.06, dur: 0.5 + Math.random()*0.2,
  });
  if (coinFx.length > 60) coinFx.length = 60;
}
function resetFloor() {
  player = { x:320, y:680, dir:{x:0,y:0}, carrying:[], trail:[], moving:false, face:1 };
  printerStack = []; deskQueue = []; screenT = 0;
  candidates = []; clients = []; bills = []; parts = []; floaters = [];
  emp = { sourcers:[], recs:[], ams:[], fins:[] }; syncEmp();
  const freshRun = state && state.tut === 0 && state.placed === 0;
  clientT = 3.5; printT = freshRun ? 0 : 1.2; panelLatch = false; exitLatch = false;
  if (freshRun) for (let i = 0; i < 3; i++) printerStack.push(pickResumeVert());
  padProg = {}; rushOn = false; rushLeft = 0; promoCd = 0; payFlash = 0; rushBank = 0;
}
resetFloor();
cashEverPicked = false; hintIT = false; hintHC = false;

const mul = () => COUNTRIES[state.country].mul;
const carryCap = () => 3 + state.ups.cap;
const followCap = () => 3 + state.ups.cap;
const playerSpeed = () => 250 * (1 + 0.12*state.ups.speed);
const printInterval = () => 3.0 * Math.pow(0.845, state.ups.printer);
const printCap = () => 6 + state.ups.printer;
const screenTime = () => 3.8 * Math.pow(0.85, state.ups.screen);
const PFACT = [1.25, 1.02, 0.86];
const patienceMax = () => 24 * PFACT[state.country] * Math.pow(1.2, state.ups.patience);
const heat = () => Math.min(1, state.placed/34);
const chainMul = () => 1;
const staffSpeed = () => 152 * (1 + 0.18*state.ups.staff);
const adsFactor = () => Math.max(0.68, Math.pow(0.93, state.ups.ads));
const vipChance = () => 0.08 + 0.03*state.ups.vipnet;
const rejectRate = () => Math.max(0.05, 0.18 * Math.pow(0.76, state.ups.quality));
const sourcerCarry = () => 4 + state.ups.staffcap;
const amCap = () => 2 + Math.floor(state.ups.staffcap/1.5);
const boothCap = () => Math.min(6, 3 + state.ups.booth);
let atBooth = false;
let UI_SCALE = 1;
const F = (w, s) => w + ' ' + Math.round(s * UI_SCALE) + 'px Fredoka';
let isCoarse = false; try { isCoarse = matchMedia('(pointer: coarse)').matches; } catch(e) {}
let idleT = 0;
let roomRec = [];  // roomRec[i] === true when a recruiter is present and working in room i
function popWrap(x, y, pop, fn) {
  if (pop > 0) {
    ctx.save(); ctx.translate(x, y); ctx.scale(1 + 0.3*pop, 1 - 0.3*pop); ctx.translate(-x, -y);
    fn(); ctx.restore();
  } else fn();
}
function moveToward(u, tx, ty, sp, dtv, arr) {
  const d = dist(u.x, u.y, tx, ty);
  if (d < (arr || 14)) return true;
  u.x += (tx-u.x)/d*Math.min(sp*dtv, d); u.y += (ty-u.y)/d*Math.min(sp*dtv, d);
  return false;
}
const recRooms = () => Math.min(boothCap() - 1, state.hires.rec);
const playerRoom = () => atBooth ? recRooms() : -1;
const interviewTime = () => 3.2 * Math.pow(0.82, state.ups.aiint);
const promoCost = () => nice((70 + state.placed * 1.2) * mul());
const payrollTotal = () => {
  let s = 0;
  Object.keys(SALARY).forEach(k => { s += SALARY[k] * (state.hires[k]||0); });
  return nice(s * mul());
};
const monthlyDue = () => payrollTotal();
const trading = () => state.tut >= TUT.length || state.placed >= 3;
const START_CASH = 1000;
const PAY_GATE = () => 5000 * mul();
const RUIN = () => 10000 * mul();
const payrollOn = () => !!state.payOn;

const zoneCap = () => Math.min(12, 6 + 2*state.ups.zone);
const readyCap = () => Math.min(6, 2 + 2*state.ups.ready);
const clientCap = () => Math.min(4, 3 + state.ups.slots);
const feeOf = v => VERTS[v].fee * mul() * (1 + 0.15*state.ups.rep) * chainMul() * (rushOn ? 1.5 : 1);
const nice = n => n < 200 ? Math.round(n/5)*5 : n < 2000 ? Math.round(n/10)*10 : Math.round(n/50)*50;
const upTotal = () => { let n = 0; for (const k in state.ups) n += state.ups[k]; return n; };
const upCost = k => nice(UPS[k].base * Math.pow(UPS[k].mult, state.ups[k]) * (1 + 0.004*Math.pow(upTotal(), 1.5)) * mul());

let PXR = 1;
// The office is a fixed 820x1120 world. The canvas fills the whole viewport and the
// world is centred inside it, with the floor extended to every edge - no letterbox bars.
const TOPPAD = 150;            // guaranteed world px above the office, keeps stations clear of the HUD
let OFFX = 0, OFFY = 0;        // world px of extra space left of / above the office
let VIS_W = VW, VIS_H = VH;    // visible world size
function resize() {
  const dpr = Math.min(devicePixelRatio||1, 2);
  const cw = Math.max(1, innerWidth), ch = Math.max(1, innerHeight);
  scaleF = Math.min(cw/VW, ch/(VH + TOPPAD));
  UI_SCALE = Math.max(1, Math.min(2, 0.9/scaleF));
  PXR = Math.max(0.1, dpr * scaleF);
  VIS_W = cw/scaleF; VIS_H = ch/scaleF;
  OFFX = Math.max(0, (VIS_W - VW)/2);
  OFFY = Math.max(0, Math.min(VIS_H - VH, Math.max(TOPPAD, (VIS_H - VH)*0.45)));
  cv.width = Math.max(1, Math.round(cw*dpr)); cv.height = Math.max(1, Math.round(ch*dpr));
  cv.style.width = cw + 'px'; cv.style.height = ch + 'px';
  wrap.style.width = cw + 'px'; wrap.style.height = ch + 'px';
  ctx.setTransform(PXR, 0, 0, PXR, OFFX*PXR, OFFY*PXR);
  vgCache = null; bgKey = ''; chipKey = '';
}

let lastT = 0, saveT = 0;
function loop(t) {
  const dt = Math.min(0.05, (t - lastT)/1000 || 0.016);
  lastT = t;
  update(dt);
  render();
  const cEl = $('cash'), cTxt = fmt(state.cash);
  const cCol = state.cash < 0 ? '#8A2418' : '';
  if (cEl._col !== cCol) { cEl._col = cCol; cEl.style.color = cCol; }
  if (cEl.textContent !== cTxt) {
    cEl.textContent = cTxt;
    cEl.classList.add('pop');
    clearTimeout(cEl._p); cEl._p = setTimeout(() => cEl.classList.remove('pop'), 130);
  }
  const pr = passiveRate();
  $('passiveTxt').textContent = pr ? '+' + fmt(pr) + '/min  ·  tap to travel' : 'Build your empire';
  const pc = $('payChip');
  if (!payrollOn()) pc.style.display = 'none';
  else {
    const due = monthlyDue(), t2 = Math.ceil(state.payT);
    const ph = 'Payroll ' + fmt(due) + ' in ' + t2 + 's<small>&nbsp;</small>';
    const pbg = state.cash < due ? 'rgba(180,58,42,0.82)' : 'rgba(59,50,39,0.55)';
    pc.style.display = 'block';
    if (pc._h !== ph) { pc._h = ph; pc.innerHTML = ph; }
    if (pc._bg !== pbg) { pc._bg = pbg; pc.style.background = pbg; }
  }
  const ob = $('objective');
  if (state.tut < TUT.length) { ob.style.display = 'block'; ob.textContent = TUT[state.tut].txt; }
  else ob.style.display = 'none';
  if (panelOpen && every('pnl', 0.5)) {
    panelBtns.forEach(x => { x.el.disabled = state.cash < x.cost; });
    $('panelCash').textContent = fmt(state.cash);
  }
  saveT += dt;
  if (saveT > 8) { saveT = 0; saveGame(); }
  requestAnimationFrame(loop);
}

document.addEventListener('visibilitychange', () => { if (document.hidden) saveGame(); });

(async function boot() {
  resize();
  let wiped = false;
  try {
    if (/[?&#]reset\b/.test(location.search + location.hash)) { await wipeSave(); wiped = true; }
  } catch(e) {}
  const loaded = wiped ? null : await loadGame();
  if (loaded && typeof loaded.cash === 'number' && isFinite(loaded.cash)) {
    state = Object.assign(freshState(), loaded);
    state.ups = Object.assign(freshOffice().ups, loaded.ups || {});
    state.hires = Object.assign(freshOffice().hires, loaded.hires || {});
    state.country = Math.min(COUNTRIES.length-1, Math.max(0, loaded.country|0));
    state.tut = Math.min(TUT.length, Math.max(0, loaded.tut|0));
    state.placed = Math.max(0, loaded.placed|0);
    state.verts = (Array.isArray(loaded.verts) ? loaded.verts : ['bc']).filter(v => VERTS[v]);
    if (!state.verts.length) state.verts = ['bc'];
    Object.keys(HIRES).forEach(k => { state.hires[k] = Math.max(0, Math.min(HIRES[k].max, +state.hires[k] || 0)); });
    Object.keys(UPS).forEach(k => { state.ups[k] = Math.max(0, Math.min(UPS[k].max, +state.ups[k] || 0)); });
    state.lost = Math.max(0, loaded.lost|0);
    state.rejected = Math.max(0, loaded.rejected|0);
    state.payOn = !!loaded.payOn;
    state.earned = Math.max(0, +loaded.earned || 0);
    state.payT = (typeof loaded.payT === 'number' && loaded.payT > 0) ? Math.min(MONTH, loaded.payT) : MONTH;
    state.months = Math.max(0, loaded.months|0);
    // migrations for saves older than v1
    delete state.ups.culture; delete state.chain; delete state.debt;
    state.v = 1;
    state.offices = {};
    if (loaded.offices) Object.keys(loaded.offices).forEach(k => {
      const i = +k;
      if (i >= 0 && i < COUNTRIES.length && i !== state.country) state.offices[i] = loaded.offices[k];
    });
    delete state.hires.mkt;
    syncEmp();
    const mins = Math.min(360, (Date.now() - (loaded.ts || Date.now()))/60000);
    const gain = passiveRate() * mins;
    if (gain >= 1) {
      state.cash += gain; state.earned = (state.earned||0) + gain;
      showModal('Welcome back', 'While you were away, your HQ offices earned <b>' + fmt(gain) + '</b>.', [{ label:'Collect', pri:true }]);
    }
  } else {
    state = freshState();
  }
  resetFloor();
  applyHud();
  cv.tabIndex = 0;
  setTimeout(() => { try { cv.focus(); } catch(e) {} }, 150);
  try {
    if (matchMedia('(pointer: coarse)').matches) toast('Drag anywhere to walk');
    else toast('Move with WASD or the arrow keys');
  } catch(e) {}
  requestAnimationFrame(loop);
})();
</script>
</body>
